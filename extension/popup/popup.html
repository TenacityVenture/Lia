<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LIA Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container" id="unauthenticated">
    <h1>Welcome to LIA ✨</h1>
    <p>Your intelligent LinkedIn assistant</p>
    <button id="signin-btn primary-button">Sign in with LinkedIn</button>
  </div>

  <div class="container" id="authenticated" style="display: none;">
    <header>
      <h2>Hello 👋 <span id="username">...</span></h2>
      <p class="highlight">You've enhanced <strong id="rewrite-count">0</strong> posts with LIA</p>
    </header>

    <div class="settings">
      <label>Writing Tone:</label>
      <select id="tone">
        <option value="professional">Professional</option>
        <option value="casual">Casual</option>
        <option value="enthusiastic">Enthusiastic</option>
        <option value="informative">Informative</option>
      </select>

      <label>Industry:</label>
      <select id="industry">
        <option value="tech">Tech</option>
        <option value="finance">Finance</option>
        <option value="education">Education</option>
        <option value="marketing">Marketing</option>
      </select>
    </div>

    <div class="features">
      <label><input type="checkbox" id="rewrite-enabled" checked /> Enable Rewrite</label>
      <label><input type="checkbox" id="reply-enabled" checked /> Enable Comment Replies</label>
    </div>

    <button id="save-btn" class="primary-button">Save Settings</button>

    <footer>
      <p>LIA v0.1 by Tenacity</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
